name: Build Kernel for Redmi K40 (Alioth)

on:
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions
    inputs:
      make_clean:
        description: 'Chạy make clean trước khi build?'
        required: false
        default: 'true'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04 # Sử dụng Ubuntu 20.04 container để ổn định môi trường

    env:
      # --- CẤU HÌNH CỦA BẠN (HÃY SỬA PHẦN NÀY) ---
      KERNEL_SOURCE: "https://github.com/Tên-User-Của-Bạn/Tên-Repo-Kernel" # Link repo kernel của bạn
      KERNEL_BRANCH: "tên-branch-của-bạn" # Ví dụ: 13, fourteen, lineage-21
      DEFCONFIG_NAME: "vendor/alioth_defconfig" # Tên file defconfig (check trong arch/arm64/configs/)
      
      # AnyKernel3 dành cho Alioth (Nên dùng bản đã config sẵn partition cho K40)
      ANYKERNEL_SOURCE: "https://github.com/osm0sis/AnyKernel3" 
      ANYKERNEL_BRANCH: "master"
      
      # Toolchain (Khuyên dùng Proton Clang hoặc Azure Clang)
      CLANG_URL: "https://github.com/kdrag0n/proton-clang"
      CLANG_BRANCH: "master"
      # --------------------------------------------

      TZ: Asia/Ho_Chi_Minh

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }} # Tự động lấy repo hiện tại
        ref: ${{ env.KERNEL_BRANCH }}
        path: kernel_workspace

    - name: Update & Install Dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          git bc bison flex libssl-dev build-essential curl \
          libncurses5-dev libncurses5 zip unzip zlib1g-dev \
          ca-certificates python3 python2
        
    - name: Clone Clang Toolchain
      run: |
        git clone --depth=1 -b ${{ env.CLANG_BRANCH }} ${{ env.CLANG_URL }} clang

    - name: Clone AnyKernel3
      run: |
        git clone --depth=1 -b ${{ env.ANYKERNEL_BRANCH }} ${{ env.ANYKERNEL_SOURCE }} AnyKernel3

    - name: Set up Environment Variables
      run: |
        echo "CC=clang" >> $GITHUB_ENV
        echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "KBUILD_BUILD_USER=GithubAction" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=Github" >> $GITHUB_ENV

    - name: Clean Build (Optional)
      if: ${{ inputs.make_clean == 'true' }}
      working-directory: kernel_workspace
      run: |
        make O=out clean
        make O=out mrproper

    - name: Configure Kernel
      working-directory: kernel_workspace
      run: |
        make O=out ARCH=arm64 ${{ env.DEFCONFIG_NAME }}

    - name: Build Kernel
      working-directory: kernel_workspace
      run: |
        # Lệnh build chính. Điều chỉnh CROSS_COMPILE nếu cần (tuỳ toolchain)
        make -j$(nproc --all) O=out \
             ARCH=arm64 \
             CC=clang \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
             LLVM=1 \
             LLVM_IAS=1

    - name: Package Kernel (AnyKernel3)
      run: |
        cd AnyKernel3
        # Copy các file output vào AnyKernel3. 
        # LƯU Ý: Alioth thường dùng Image hoặc Image.gz-dtb tuỳ tree.
        # Bạn cần kiểm tra xem kernel build ra file nào.
        
        if [ -f "../kernel_workspace/out/arch/arm64/boot/Image" ]; then
          cp ../kernel_workspace/out/arch/arm64/boot/Image .
        elif [ -f "../kernel_workspace/out/arch/arm64/boot/Image.gz-dtb" ]; then
          cp ../kernel_workspace/out/arch/arm64/boot/Image.gz-dtb .
        else
          echo "Error: Kernel image not found!"
          exit 1
        fi

        # Copy dtbo.img nếu có (Alioth thường cần cái này)
        if [ -f "../kernel_workspace/out/arch/arm64/boot/dtbo.img" ]; then
          cp ../kernel_workspace/out/arch/arm64/boot/dtbo.img .
        fi

        # Nén thành file zip
        zip -r9 AnyKernel3-Alioth-$(date +%Y%m%d-%H%M).zip * -x .git README.md *placeholder

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Alioth-Kernel-Zip
        path: AnyKernel3/*.zip

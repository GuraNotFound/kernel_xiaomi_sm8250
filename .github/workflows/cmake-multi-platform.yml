name: Build Kernel with Root Support

on:
  workflow_dispatch:
    inputs:
      root_method:
        description: 'Chọn phương pháp Root'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options:
        - KernelSU-Next
        - None
      device_defconfig:
        description: 'Tên file defconfig (ví dụ: violet_defconfig)'
        required: true
        default: 'vendor/sm8250_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cài đặt Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm curl git

      - name: Tải Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-llvm

      - name: Tích hợp Root (KernelSU-Next)
        if: github.event.inputs.root_method == 'KernelSU-Next'
        run: |
          echo "Đang tích hợp KernelSU-Next..."
          # Sử dụng script setup chính thức từ rifsxd/KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -
          
          # Thêm config vào defconfig để đảm bảo KSU được kích hoạt
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ github.event.inputs.device_defconfig }}
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/${{ github.event.inputs.device_defconfig }} 
          # Lưu ý: SUSFS là tùy chọn, nếu source k hỗ trợ thì bỏ dòng trên

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang-llvm/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Clean build
          make O=out mrproper
          
          # Load config từ input
          make O=out ${{ github.event.inputs.device_defconfig }}
          
          # Build
          make -j$(nproc --all) O=out \
                      CC=clang \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip

      - name: Đóng gói AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          
          # Copy file kernel đã build vào folder AnyKernel3
          # Kiểm tra xem output ra Image.gz hay Image.gz-dtb để copy cho đúng
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          else
             cp out/arch/arm64/boot/Image AnyKernel3/
          fi

          # Nén lại thành Zip
          cd AnyKernel3
          zip -r9 ../Kernel-KSU-Next.zip * -x .git/ README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ github.event.inputs.root_method }}
          path: Kernel-KSU-Next.zip
